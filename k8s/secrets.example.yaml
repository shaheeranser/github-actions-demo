# Example Kubernetes Secret for local/dev setup.
# Copy this file to k8s/secrets.yaml and replace the placeholders.
# `data:` values must be base64-encoded (echo -n 'value' | base64).

apiVersion: v1
kind: Secret
metadata:
  name: secrets
type: Opaque
data:
  POSTGRES_USER: REPLACE_ME               # REPLACE ME
  POSTGRES_PASSWORD: REPLACE_ME           # REPLACE ME
  RABBITMQ_USER: REPLACE_ME               # REPLACE ME
  RABBITMQ_PASS: REPLACE_ME               # REPLACE ME
  AZURE_STORAGE_ACCOUNT_NAME: REPLACE_ME  # REPLACE ME
  AZURE_STORAGE_ACCOUNT_KEY: REPLACE_ME   # REPLACE ME
